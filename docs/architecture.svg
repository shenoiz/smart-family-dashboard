<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0b0e17; }
      .panel { fill: #12172a; stroke: #232c47; stroke-width: 1.5; rx: 14; }
      .panel-accent { fill: #161d33; stroke: #4fd1e8; stroke-width: 1.5; rx: 14; }
      .panel-her { fill: #161d33; stroke: #c77dff; stroke-width: 1.5; rx: 14; }
      .panel-ext { fill: #14201a; stroke: #4ade80; stroke-width: 1.5; rx: 14; }
      .panel-infra { fill: #1a1a2e; stroke: #f5a742; stroke-width: 1.5; rx: 14; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #eef1f8; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #8891a8; }
      .box-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #eef1f8; }
      .box-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; fill: #8891a8; }
      .box-item { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #b8c0d8; }
      .section-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #f5a742; letter-spacing: 1.5px; }
      .arrow { stroke: #4fd1e8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dim { stroke: #5d6683; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-dim); stroke-dasharray: 4,3; }
      .flow-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #7cb8ff; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4fd1e8"/>
    </marker>
    <marker id="arrowhead-dim" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5d6683"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="900"/>

  <!-- Title -->
  <text x="40" y="45" class="title">Smart Family Dashboard — System Architecture</text>
  <text x="40" y="68" class="subtitle">Raspberry Pi Zero 2W · Flask · Telegram · Epiphany Kiosk · GitHub Actions CI/CD</text>

  <!-- ===================== YOUR PHONE ===================== -->
  <text x="40" y="105" class="section-label">YOUR PHONE</text>
  <rect x="40" y="115" width="230" height="100" class="panel-accent"/>
  <text x="60" y="145" class="box-title">Telegram App</text>
  <text x="60" y="165" class="box-item">/add him · /add her</text>
  <text x="60" y="181" class="box-item">/done · /list · /clear</text>
  <text x="60" y="197" class="box-item">Bot replies + notifications</text>

  <!-- ===================== RASPBERRY PI ===================== -->
  <text x="40" y="255" class="section-label">RASPBERRY PI ZERO 2W</text>
  <rect x="40" y="265" width="900" height="480" rx="16" fill="#0f1320" stroke="#2a3352" stroke-width="1.5"/>

  <!-- Flask -->
  <rect x="70" y="295" width="240" height="130" class="panel"/>
  <text x="90" y="325" class="box-title">Flask Server (app.py)</text>
  <text x="90" y="345" class="box-sub">systemd: dashboard.service</text>
  <text x="90" y="368" class="box-item">/api/todos · /api/weather</text>
  <text x="90" y="384" class="box-item">/api/forecast · /api/panchang</text>
  <text x="90" y="400" class="box-item">/api/today · /api/system</text>
  <text x="90" y="416" class="box-item">/api/network · SocketIO push</text>

  <!-- Telegram bot -->
  <rect x="340" y="295" width="220" height="130" class="panel"/>
  <text x="360" y="325" class="box-title">Telegram Bot</text>
  <text x="360" y="345" class="box-sub">telegram_bot.py (thread)</text>
  <text x="360" y="368" class="box-item">Reads/writes todos.json</text>
  <text x="360" y="384" class="box-item">Him / Her lists</text>
  <text x="360" y="400" class="box-item">Triggers audio + SocketIO</text>
  <text x="360" y="416" class="box-item">push on every change</text>

  <!-- Scheduler -->
  <rect x="590" y="295" width="180" height="130" class="panel"/>
  <text x="610" y="325" class="box-title">Scheduler</text>
  <text x="610" y="345" class="box-sub">scheduler.py (thread)</text>
  <text x="610" y="368" class="box-item">Good Morning routine</text>
  <text x="610" y="384" class="box-item">Nightly display-off</text>
  <text x="610" y="400" class="box-item">(power-button relay,</text>
  <text x="610" y="416" class="box-item">GPIO simulated press)</text>

  <!-- Drive sync -->
  <rect x="800" y="295" width="120" height="130" class="panel"/>
  <text x="815" y="325" class="box-title">Drive Sync</text>
  <text x="815" y="345" class="box-sub">background</text>
  <text x="815" y="368" class="box-item">thread, syncs</text>
  <text x="815" y="384" class="box-item">every 6 hrs</text>

  <!-- todos.json data store -->
  <rect x="70" y="450" width="240" height="70" rx="10" fill="#1a1a2e" stroke="#5d6683" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="90" y="475" class="box-title" style="font-size:13px">data/todos.json</text>
  <text x="90" y="495" class="box-item">{ "him": [...], "her": [...] }</text>

  <!-- Kiosk display chain -->
  <rect x="340" y="450" width="580" height="130" class="panel-accent"/>
  <text x="360" y="480" class="box-title">Kiosk Display Chain</text>
  <text x="360" y="500" class="box-sub">lightdm → Openbox autologin session</text>
  <text x="360" y="522" class="box-item">1. Openbox autostart script launches Epiphany (incognito mode)</text>
  <text x="360" y="538" class="box-item">2. Script polls for the real content window (skips the 1×1 GTK helper window)</text>
  <text x="360" y="554" class="box-item">3. wmctrl forces fullscreen · xdotool focuses window and sends F11</text>
  <text x="360" y="570" class="box-item">4. Cursor parked off-screen bottom to prevent the hover-reveal toolbar</text>

  <!-- Audio -->
  <rect x="70" y="600" width="200" height="90" class="panel"/>
  <text x="90" y="628" class="box-title" style="font-size:13px">Audio Manager</text>
  <text x="90" y="648" class="box-item">pygame + ALSA</text>
  <text x="90" y="664" class="box-item">Todo-added + Good</text>
  <text x="90" y="680" class="box-item">Morning sound cues</text>

  <!-- Persistent journal -->
  <rect x="290" y="600" width="200" height="90" class="panel"/>
  <text x="310" y="628" class="box-title" style="font-size:13px">Persistent Logging</text>
  <text x="310" y="648" class="box-item">systemd-journald</text>
  <text x="310" y="664" class="box-item">Storage=persistent</text>
  <text x="310" y="680" class="box-item">SystemMaxUse=200M</text>

  <!-- Auto-reload safety net -->
  <rect x="510" y="600" width="200" height="90" class="panel"/>
  <text x="530" y="628" class="box-title" style="font-size:13px">Self-Healing Reload</text>
  <text x="530" y="648" class="box-item">Dashboard JS reloads</text>
  <text x="530" y="664" class="box-item">the page every 30 min</text>
  <text x="530" y="680" class="box-item">to clear browser memory</text>

  <!-- Tailscale -->
  <rect x="730" y="600" width="190" height="90" class="panel"/>
  <text x="750" y="628" class="box-title" style="font-size:13px">Tailscale</text>
  <text x="750" y="648" class="box-item">Private tunnel used</text>
  <text x="750" y="664" class="box-item">only by the CD pipeline</text>
  <text x="750" y="680" class="box-item">to reach the Pi's SSH</text>

  <!-- ===================== DISPLAY ===================== -->
  <text x="990" y="255" class="section-label">15" DISPLAY</text>
  <rect x="990" y="295" width="170" height="450" rx="14" fill="#0d1117" stroke="#4fd1e8" stroke-width="2"/>
  <rect x="1005" y="310" width="140" height="55" rx="8" fill="#161d33" stroke="#232c47"/>
  <text x="1018" y="332" class="box-item" style="fill:#f5a742">Good Morning ☀️</text>
  <text x="1018" y="348" class="box-item">Weather · Panchang</text>
  <rect x="1005" y="375" width="140" height="70" rx="8" fill="#161d33" stroke="#c77dff"/>
  <text x="1018" y="397" class="box-item" style="fill:#c77dff">Her To-Do</text>
  <rect x="1005" y="455" width="140" height="70" rx="8" fill="#161d33" stroke="#4fd1e8"/>
  <text x="1018" y="477" class="box-item" style="fill:#4fd1e8">Him To-Do</text>
  <rect x="1005" y="535" width="140" height="55" rx="8" fill="#0d1712" stroke="#4ade80"/>
  <text x="1018" y="557" class="box-item" style="fill:#4ade80">On This Day</text>
  <rect x="1005" y="600" width="140" height="55" rx="8" fill="#161d33" stroke="#232c47"/>
  <text x="1018" y="622" class="box-item">Photo Slideshow</text>
  <rect x="1005" y="665" width="140" height="60" rx="8" fill="#161d33" stroke="#232c47"/>
  <text x="1018" y="687" class="box-item">CPU · RAM · IP</text>
  <text x="1018" y="703" class="box-item">Google Drive · Bot</text>

  <!-- ===================== EXTERNAL APIS ===================== -->
  <text x="40" y="775" class="section-label">EXTERNAL APIS — called server-side from Flask only</text>
  <rect x="40" y="785" width="180" height="80" class="panel-ext"/>
  <text x="55" y="810" class="box-title" style="font-size:13px">Telegram API</text>
  <text x="55" y="828" class="box-item">Bot polling</text>
  <text x="55" y="844" class="box-item">python-telegram-bot</text>

  <rect x="240" y="785" width="180" height="80" class="panel-ext"/>
  <text x="255" y="810" class="box-title" style="font-size:13px">OpenWeatherMap</text>
  <text x="255" y="828" class="box-item">Current + 5-day</text>
  <text x="255" y="844" class="box-item">forecast</text>

  <rect x="440" y="785" width="180" height="80" class="panel-ext"/>
  <text x="455" y="810" class="box-title" style="font-size:13px">Prokerala API</text>
  <text x="455" y="828" class="box-item">OAuth2 token cache</text>
  <text x="455" y="844" class="box-item">Panchang · Ekadashi</text>

  <rect x="640" y="785" width="180" height="80" class="panel-ext"/>
  <text x="655" y="810" class="box-title" style="font-size:13px">Wikipedia REST</text>
  <text x="655" y="828" class="box-item">On This Day feed</text>
  <text x="655" y="844" class="box-item">cached once/day</text>

  <rect x="840" y="785" width="180" height="80" class="panel-ext"/>
  <text x="855" y="810" class="box-title" style="font-size:13px">Google Drive API</text>
  <text x="855" y="828" class="box-item">Service account</text>
  <text x="855" y="844" class="box-item">Photo slideshow sync</text>

  <!-- ===================== ARROWS ===================== -->
  <!-- phone to telegram bot -->
  <path class="arrow" d="M 270 165 L 400 165 L 400 295"/>
  <text x="280" y="155" class="flow-label">Telegram Bot API (polling)</text>

  <!-- telegram bot to json -->
  <path class="arrow" d="M 400 425 L 400 440 L 190 440 L 190 450"/>

  <!-- json to flask -->
  <path class="arrow" d="M 190 450 L 190 425"/>

  <!-- flask to socketio push to kiosk -->
  <path class="arrow" d="M 310 360 L 630 360 L 630 450"/>
  <text x="420" y="350" class="flow-label">SocketIO push + 10s poll</text>

  <!-- kiosk to display -->
  <path class="arrow" d="M 920 500 L 990 500"/>
  <text x="928" y="492" class="flow-label">renders</text>

  <!-- flask to external apis -->
  <path class="arrow-dim" d="M 190 425 L 190 700 L 130 700 L 130 785"/>
  <path class="arrow-dim" d="M 220 425 L 330 700 L 330 785"/>
  <path class="arrow-dim" d="M 250 425 L 530 700 L 530 785"/>
  <path class="arrow-dim" d="M 270 425 L 730 700 L 730 785"/>
  <path class="arrow-dim" d="M 300 425 L 930 700 L 930 785"/>
  <text x="60" y="765" class="flow-label">Flask calls out to each API, caches results, serves them locally to the browser</text>

</svg>
